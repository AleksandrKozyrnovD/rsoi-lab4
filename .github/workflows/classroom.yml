name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Build images
        timeout-minutes: 10
        run: docker compose build

      - name: Run containers
        timeout-minutes: 5
        run: |
          docker compose up -d

      - uses: actions/setup-go@v4
        with:
          go-version: '1.27'

      - name: Run unit tests loyalty
        working-directory: ./project/loyalty-service
        run: pwd && go test -v -short ./service/...

      - name: Run unit tests payment
        working-directory: ./project/payment-service
        run: go test -v -short ./service/...

      - name: Run unit tests reservation
        working-directory: ./project/reservation-service
        run: go test -v -short ./service/...

      - name: Build images
        timeout-minutes: 10
        run: docker compose build --push

      # TODO deploy to k8s with liveness and readyness probes

      - name: Wait before services are ready
        run: kubectl wait -n test -l app.kubernetes.io/name=gateway pod --for=condition=Ready --timeout 3m
      
      # TODO setup parameters in classroom/autograding.json
      
      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true
