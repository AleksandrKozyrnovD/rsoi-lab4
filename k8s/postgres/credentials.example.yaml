# EXAMPLE ONLY. Copy to a private file (e.g. k8s/postgres/credentials.local.yaml),
# replace ALL values with different strong passwords, and chmod 600 that file.
# Never publish the populated file. Keep a backup for the lifetime of the DB PVC.
# Pass the same private file to the postgres release and the services release.
# Changing these values after first initialization requires ALTER ROLE in PostgreSQL.
auth:
  adminPassword: REPLACE_WITH_POSTGRES_ADMIN_PASSWORD
  loyaltyPassword: REPLACE_WITH_LOYALTY_PASSWORD
  paymentPassword: REPLACE_WITH_PAYMENT_PASSWORD
  reservationPassword: REPLACE_WITH_RESERVATION_PASSWORD
