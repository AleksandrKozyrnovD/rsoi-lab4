# The official PostgreSQL image executes this SQL only on an EMPTY data volume.
# Updating the Secret does NOT rotate existing database passwords.
# SQL is stored in a Secret, not a ConfigMap, because it contains role passwords.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-init
type: Opaque
stringData:
  10-init.sql: |
    CREATE ROLE loyalty LOGIN PASSWORD '{{ required "auth.loyaltyPassword is required" .Values.auth.loyaltyPassword | replace "'" "''" }}';
    CREATE ROLE payment LOGIN PASSWORD '{{ required "auth.paymentPassword is required" .Values.auth.paymentPassword | replace "'" "''" }}';
    CREATE ROLE reservation LOGIN PASSWORD '{{ required "auth.reservationPassword is required" .Values.auth.reservationPassword | replace "'" "''" }}';

    CREATE DATABASE loyalties OWNER loyalty;
    CREATE DATABASE payments OWNER payment;
    CREATE DATABASE reservations OWNER reservation;
    REVOKE ALL ON DATABASE loyalties, payments, reservations, postgres FROM PUBLIC;

    \connect loyalties
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    CREATE TABLE loyalties (
      id bigserial PRIMARY KEY,
      username varchar(80) NOT NULL UNIQUE,
      reservation_count bigint NOT NULL DEFAULT 0,
      status varchar(80) NOT NULL DEFAULT 'BRONZE' CHECK (status IN ('BRONZE', 'SILVER', 'GOLD')),
      discount bigint NOT NULL
    );
    ALTER TABLE loyalties OWNER TO loyalty;
    INSERT INTO loyalties (username, reservation_count, status, discount)
      VALUES ('Test Max', 25, 'GOLD', 10);

    \connect payments
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;

    \connect reservations
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    CREATE TABLE hotels (
      hotel_uid uuid PRIMARY KEY,
      name text NOT NULL,
      country text NOT NULL,
      city text NOT NULL,
      address text NOT NULL,
      stars bigint NOT NULL,
      price bigint NOT NULL
    );
    ALTER TABLE hotels OWNER TO reservation;
    INSERT INTO hotels (hotel_uid, name, country, city, address, stars, price)
      VALUES ('049161bb-badd-4fa8-9d90-87c9a82b0668', 'Ararat Park Hyatt Moscow',
              'Россия', 'Москва', 'Неглинная ул., 4', 5, 10000);
